<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Resume Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #0f0f0f; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 720px; padding: 40px 24px; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    p.sub { color: #888; margin-bottom: 32px; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
    textarea { width: 100%; background: #1a1a1a; border: 1px solid #2e2e2e; border-radius: 8px; color: #f0f0f0; padding: 12px; font-size: 0.95rem; resize: vertical; min-height: 140px; }
    input[type="file"] { display: none; }
    .file-label { display: block; background: #1a1a1a; border: 1px dashed #444; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; color: #888; margin-bottom: 24px; transition: border-color 0.2s; }
    .file-label:hover { border-color: #888; }
    .file-label.selected { border-color: #6c63ff; color: #6c63ff; }
    .section { margin-bottom: 20px; }
    button { width: 100%; padding: 14px; background: #6c63ff; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #574fd6; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    .result { margin-top: 32px; background: #1a1a1a; border-radius: 12px; padding: 24px; border: 1px solid #2e2e2e; }
    .score { font-size: 3rem; font-weight: 800; color: #6c63ff; }
    .score-label { color: #888; margin-bottom: 20px; }
    .missing { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 20px; }
    .tag { background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; color: #ccc; }
    .recs { white-space: pre-wrap; color: #ccc; line-height: 1.7; font-size: 0.95rem; }
    h2 { font-size: 1rem; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .spinner { display: none; text-align: center; padding: 20px; color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 Resume Analyzer</h1>
    <p class="sub">Upload your resume and paste a job description to get an AI-powered match score and recommendations.</p>

    <div class="section">
      <label>Job Description</label>
      <textarea id="jobDesc" placeholder="Paste the job description here..."></textarea>
    </div>

    <div class="section">
      <label>Resume (PDF)</label>
      <label class="file-label" id="fileLabel" for="resumeFile">📄 Click to upload your resume PDF</label>
      <input type="file" id="resumeFile" accept=".pdf" onchange="updateLabel(this)" />
    </div>

    <button id="analyzeBtn" onclick="analyze()">Analyze Resume</button>
    <div class="spinner" id="spinner">⏳ Analyzing with AI... this may take a moment</div>

    <div class="result" id="result" style="display:none">
      <div class="score" id="score"></div>
      <div class="score-label">Match Score</div>
      <h2>Missing Skills</h2>
      <div class="missing" id="missing"></div>
      <h2>Recommendations</h2>
      <div class="recs" id="recs"></div>
    </div>
  </div>

  <script>
    function updateLabel(input) {
      const label = document.getElementById("fileLabel");
      label.textContent = input.files[0] ? `✅ ${input.files[0].name}` : "📄 Click to upload your resume PDF";
      label.classList.toggle("selected", !!input.files[0]);
    }

    async function analyze() {
      const jobDesc = document.getElementById("jobDesc").value.trim();
      const file = document.getElementById("resumeFile").files[0];
      if (!jobDesc || !file) return alert("Please fill in both fields.");

      const btn = document.getElementById("analyzeBtn");
      const spinner = document.getElementById("spinner");
      const result = document.getElementById("result");

      btn.disabled = true;
      spinner.style.display = "block";
      result.style.display = "none";

      const formData = new FormData();
      formData.append("job_description", jobDesc);
      formData.append("resume", file);

      try {
        const res = await fetch("/analyze", { method: "POST", body: formData });
        const data = await res.json();

        document.getElementById("score").textContent = `${data.match_percent}%`;
        document.getElementById("missing").innerHTML = data.missing_skills.map(s => `<span class="tag">${s}</span>`).join("");
        document.getElementById("recs").textContent = data.recommendations;
        result.style.display = "block";
      } catch (e) {
        alert("Something went wrong. Make sure the server is running.");
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
      }
    }
  </script>
</body>
</html>
